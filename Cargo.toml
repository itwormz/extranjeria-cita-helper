[workspace]
members = ["crates/ceh-core", "crates/ceh-browser", "crates/ceh-store", "crates/ceh-services", "crates/ceh-cli", "crates/ceh-desktop"]
resolver = "3"

[workspace.package]
version = "0.4.0-beta.1"
edition = "2024"
rust-version = "1.89"
license-file = "LICENSE"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "=2.5.8"
sha2 = "0.10"
regex = "1"
chrono = { version = "0.4", default-features = false, features = ["std"] }

yaml-rust2 = { version = "=0.13.0", default-features = false }
num-bigint = "=0.4.8"

rusqlite = { version = "=0.41.1", default-features = false, features = ["bundled", "backup", "functions"] }
chrono-tz = "=0.10.4"
