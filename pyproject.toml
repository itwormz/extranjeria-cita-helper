[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "extranjeria-cita-helper"
version = "0.1.0"
description = "Desktop assistant for Extranjeria appointment forms and availability checks"
requires-python = ">=3.12"
dependencies = [
  "camoufox[geoip]>=0.5.7,<0.6",
  "certifi>=2025.1",
  "cryptography>=45,<47",
  "playwright>=1.49,<2",
  "PyYAML>=6,<7",
  "tzdata>=2025.1",
]

[project.optional-dependencies]
desktop = ["PySide6-Essentials>=6.8,<7"]
build = [
    "PyInstaller>=6.12,<7",
    "Pillow>=11,<13",
    "fonttools==4.60.1",
]

[dependency-groups]
dev = [
  "pytest>=8,<10",
  "pytest-cov>=5,<8",
]

[tool.setuptools.package-data]
"app.desktop" = ["assets/*.svg", "assets/*.json", "assets/*.wav", "assets/fonts/*.ttf", "assets/fonts/LICENSE.txt"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
