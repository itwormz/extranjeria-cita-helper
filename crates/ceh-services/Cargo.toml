[package]
name = "ceh-services"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license-file = "../../LICENSE"
publish.workspace = true

[features]
default = []
native-vault = ["dep:keyring-core", "dep:apple-native-keyring-store", "dep:windows-native-keyring-store", "dep:zbus-secret-service-keyring-store"]

[dependencies]
serde_json.workspace = true
ceh-core = { path = "../ceh-core" }
regex.workspace = true
chrono.workspace = true
chrono-tz.workspace = true
reqwest = { version = "=0.13.5", default-features = false, features = ["blocking", "json", "rustls"] }
httpdate = "=1.0.3"
sha2.workspace = true
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
fs2 = "=0.4.3"
tempfile = "=3.27.0"
filetime = "0.2"
base64 = "=0.22.1"
zeroize = "=1.8.2"
uuid = { version = "1", features = ["v4", "v5"] }
keyring-core = { version = "=1.0.1", optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "=1.0.2", features = ["keychain"], optional = true }

[target.'cfg(windows)'.dependencies]
windows-native-keyring-store = { version = "=1.1.0", optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
zbus-secret-service-keyring-store = { version = "=1.0.1", features = ["rt-tokio-crypto-rust"], optional = true }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
