name: Application bug
description: Report an application error, crash or unexpected behaviour.
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: |
        English, Spanish or Russian are welcome. Describe what is already known; there is no need to repeat a live search.
        This issue is public. Remove personal data, including NIE/DNI/passport numbers, appointment numbers, credentials and session identifiers. Do not attach raw HTML or browser profiles.
        For a suspected vulnerability, follow [SECURITY.md](https://github.com/itwormz/extranjeria-cita-helper/blob/main/SECURITY.md).
  - type: dropdown
    id: service
    attributes:
      label: Appointment service
      description: Select the service configured in the profile, or indicate a general issue.
      options:
        - Toma de huellas / TIE
        - Autorización de regreso
        - Both / general application issue
        - Not sure
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: What happened, and what was expected instead?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Application version
      description: Shown in About. Enter "unknown" if unavailable.
      placeholder: e.g. 0.2.1
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: Operating system
      description: Include its version and architecture if known.
      placeholder: e.g. macOS 27 ARM64, Windows 11 x64, Debian 13 x64
    validations:
      required: true
  - type: input
    id: province
    attributes:
      label: Province (if relevant)
  - type: dropdown
    id: authentication
    attributes:
      label: Authentication method (if relevant)
      options:
        - Digital certificate
        - Cl@ve Móvil
        - Cl@ve Permanente
        - Without authentication
        - Not sure / not relevant
  - type: textarea
    id: steps
    attributes:
      label: Steps or additional context (optional)
      description: What was happening before the problem? Share only what is already known.
  - type: textarea
    id: report
    attributes:
      label: Technical report or timeline excerpt (optional)
      description: For startup errors, use Copy report in the app. Review the text and remove sensitive information before posting. Do not enable page diagnostics just to complete this form.
      render: text
  - type: textarea
    id: screenshot
    attributes:
      label: Screenshot (optional)
      description: Attach only if helpful. Hide applicant details, appointment numbers and session identifiers first.
