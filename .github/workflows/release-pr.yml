name: Tag merged release PR

on:
  push:
    branches: [main]
    paths: ['.github/release-version']

permissions:
  contents: read

concurrency:
  group: release-pr
  cancel-in-progress: false

jobs:
  tag:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Prepare and validate release
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version=$(cat .github/release-version)
          python3 scripts/prepare_release_version.py
          python3 scripts/preflight.py --metadata-only
          test "$version" = "$(python3 -c 'from app.version import VERSION; print(VERSION)')"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
      - name: Push release tag
        shell: bash
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
          RELEASE_TOKEN: ${{ secrets.RELEASE_TAG_TOKEN }}
        run: |
          set -euo pipefail
          : "${RELEASE_TOKEN:?Configure the RELEASE_TAG_TOKEN repository secret}"
          git -c user.name="Release automation" -c user.email="release@users.noreply.github.com" \
            commit -m "Release $RELEASE_TAG" -- app/version.py pyproject.toml uv.lock CHANGELOG.md
          git tag "$RELEASE_TAG"
          auth=$(printf 'x-access-token:%s' "$RELEASE_TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          git -c "http.https://github.com/.extraheader=AUTHORIZATION: basic $auth" \
            push origin "refs/tags/$RELEASE_TAG"
