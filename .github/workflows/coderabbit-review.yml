name: Request CodeRabbit review

on:
  check_run:
    types: [completed]
  workflow_run:
    workflows: [Tests, CodeQL]
    types: [completed]
  schedule:
    # Recovery for missed events and findings resolved after checks completed.
    - cron: '3-58/5 * * * *'
  workflow_dispatch:
    inputs:
      pr:
        description: PR number (first review or repeat CodeRabbit review)
        required: true
        type: string
      dry_run:
        description: Check API access and readiness without requesting a bot review
        type: boolean
        default: false

permissions:
  actions: read # gh pr checks also queries checkSuite.workflowRun.
  contents: read
  pull-requests: write
  checks: read
  statuses: read

concurrency:
  # All triggers share the lock: event/scheduled/manual runs cannot overlap label updates.
  group: coderabbit-review-gate
  cancel-in-progress: false

jobs:
  validate:
    if: github.event_name == 'workflow_dispatch' && inputs.dry_run
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    # A selected workflow branch may be tested, but this job cannot write to PRs.
    permissions:
      actions: read
      contents: read
      pull-requests: read
      checks: read
      statuses: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Validate API access without changing review labels
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr }}
        run: |
          python3 - <<'PY'
          import os
          from scripts.request_coderabbit_review import NotReady, request_review
          number = int(os.environ['PR_NUMBER'])
          if number < 1:
              raise SystemExit('Use a positive PR number without #')
          try:
              request_review(os.environ['GITHUB_REPOSITORY'], number)
          except NotReady as exc:
              print('API access verified. PR is not ready yet: ' + str(exc))
          PY
  request:
    if: >-
      !inputs.dry_run &&
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      (github.event_name != 'check_run' || github.event.check_run.name == 'Greptile Review')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Check Greptile and CI before applying the CodeRabbit label
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr }}
          EVENT_NAME: ${{ github.event_name }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = workflow_dispatch ]; then
            python3 scripts/request_coderabbit_review.py --repo "$GITHUB_REPOSITORY" --pr "$PR_NUMBER" --request
          else
            python3 scripts/request_coderabbit_review.py --repo "$GITHUB_REPOSITORY" --automatic --base "$DEFAULT_BRANCH" --request
          fi
