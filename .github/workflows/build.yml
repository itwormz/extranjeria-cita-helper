name: Build SantaCita packages

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: santacita-packages-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: Package (${{ matrix.platform }}-${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            platform: macos
            arch: arm64
          - runner: macos-15-intel
            platform: macos
            arch: x64
          - runner: windows-2022
            platform: windows
            arch: x64
          - runner: ubuntu-22.04
            platform: linux
            arch: x64
    defaults:
      run:
        shell: bash
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: '0'
      RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Install Linux build libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libwebkit2gtk-4.1-dev build-essential libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev patchelf libfuse2 file
      - name: Install pinned Rust toolchain
        run: |
          toolchain=$(node -e "process.stdout.write(require('fs').readFileSync('rust-toolchain.toml','utf8').match(/^channel = \"([^\"]+)\"/m)[1])")
          rustup toolchain install "$toolchain" --profile minimal
          rustc --version
      - name: Validate release metadata
        run: node packaging/release.mjs metadata
      - name: Prepare locked frontend and icons
        run: node desktop-ui/scripts/prepare.mjs
      - name: Test Rust and frontend
        run: |
          cargo test --workspace --locked
          node --test desktop-ui/tests/*.test.mjs packaging/tests/*.test.mjs
      - name: Install pinned MSI tools
        if: runner.os == 'Windows'
        env:
          DOTNET_ROLL_FORWARD: Major
        run: dotnet tool install --global wix --version 4.0.6
      - name: Compile optimized release and package
        env:
          DOTNET_ROLL_FORWARD: Major
        run: node packaging/build.mjs '${{ matrix.platform }}' '${{ matrix.arch }}'
      - name: Check AppImage contents
        if: runner.os == 'Linux'
        run: |
          mkdir -p .local/builds/work/appimage-check
          cd .local/builds/work/appimage-check
          image=$(find ../../releases -maxdepth 1 -name '*.AppImage' -print -quit)
          "$image" --appimage-extract > /dev/null
          test -x squashfs-root/usr/bin/ceh-desktop
          find squashfs-root -name '*.desktop' -exec grep -l '^Name=SantaCita$' {} + | grep -q .
      - name: Attest final package names
        if: github.event_name == 'push' && github.ref_type == 'tag'
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            .local/builds/releases/*.dmg
            .local/builds/releases/*.msi
            .local/builds/releases/*.AppImage
            .local/builds/releases/*-portable.zip
      - name: Attach provenance bundles
        if: github.event_name == 'push' && github.ref_type == 'tag'
        env:
          ATTESTATION_BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: node packaging/release.mjs attach-proof '${{ matrix.platform }}' '${{ matrix.arch }}' "$ATTESTATION_BUNDLE"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: package-${{ matrix.platform }}-${{ matrix.arch }}
          path: .local/builds/releases/*
          include-hidden-files: true
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  publish-release:
    name: Publish complete release
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Install pinned Rust toolchain
        shell: bash
        run: |
          toolchain=$(node -e "process.stdout.write(require('fs').readFileSync('rust-toolchain.toml','utf8').match(/^channel = \"([^\"]+)\"/m)[1])")
          rustup toolchain install "$toolchain" --profile minimal
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: package-*
          path: .local/builds/release-assets
          merge-multiple: true
      - name: Verify provenance, upload draft, then publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: node packaging/publish.mjs .local/builds/release-assets
