name: Build desktop packages

on:
  workflow_dispatch:
    inputs:
      portable:
        description: Include optional Windows portable ZIP
        type: boolean
        default: true
  push:
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    permissions:
      contents: read
      id-token: write
      attestations: write
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            platform: macos
            arch: arm64
            bundle: data/dist/Cita Extranjeria Helper.app
          - runner: macos-15-intel
            platform: macos
            arch: x64
            bundle: data/dist/Cita Extranjeria Helper.app
          - runner: ubuntu-22.04
            platform: linux
            arch: x64
            bundle: data/dist/Cita Extranjeria Helper
          - runner: windows-2022
            platform: windows
            arch: x64
            bundle: data/dist/Cita Extranjeria Helper
    defaults:
      run:
        shell: bash
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: '3.13'
      - name: Install dependencies
        run: uv sync --frozen --extra desktop --extra build
      - name: Install Linux native libraries
        if: runner.os == 'Linux'
        run: |
          uv run python -m playwright install-deps firefox
          sudo apt-get update
          sudo apt-get install -y libgl1 libegl1 libxcb-cursor0 libxkbcommon-x11-0 libpulse0 libxcb-keysyms1 libxcb-icccm4 desktop-file-utils
      - name: Check release metadata
        run: uv run python scripts/preflight.py --metadata-only
      - name: Check tag version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: uv run python scripts/package_release.py --platform '${{ matrix.platform }}' --arch '${{ matrix.arch }}' --check-tag "$RELEASE_TAG"
      - name: Check source privacy
        run: uv run python scripts/check_privacy.py --tree .
      - name: Test
        run: uv run pytest
      - name: Fetch public browser
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          uv run python -m camoufox fetch
          uv run python -c "from camoufox.pkgman import launch_path; print(launch_path())"
      - name: Offline macOS locked-session input
        if: runner.os == 'macOS'
        env:
          CITA_BROWSER_TESTS: '1'
          CITA_TEST_ENGINE: camoufox
          PYTHONUNBUFFERED: '1'
        run: uv run pytest -x -v -o addopts='' --tb=short --durations=10 -o faulthandler_timeout=120 tests/test_local_assist_browser.py -k locked_desktop
      - name: Offline browser flow regressions
        env:
          CITA_BROWSER_TESTS: '1'
          CITA_TEST_ENGINE: camoufox
          PYTHONUNBUFFERED: '1'
        run: uv run pytest -x -v -o addopts='' --tb=short --durations=10 -o faulthandler_timeout=120 tests/test_local_assist_browser.py tests/test_contact_fields_browser.py tests/test_procedure_groups_browser.py -k 'not locked_desktop'
      - name: Build native application
        run: uv run python scripts/build_desktop_app.py
      - name: Verify macOS signature
        if: runner.os == 'macOS'
        run: codesign --verify --deep --strict 'data/dist/Cita Extranjeria Helper.app'
      - name: Offline packaged browser and worker IPC
        run: uv run python scripts/verify_bundle.py '${{ matrix.bundle }}'
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        if: runner.os == 'Windows'
        with:
          dotnet-version: '8.0.x'
      - name: Install MSI build tools
        if: runner.os == 'Windows'
        env:
          DOTNET_ROLL_FORWARD: Major
        run: dotnet tool install --global wix --version 4.0.6
      - name: Prepare AppImage tool
        if: runner.os == 'Linux'
        run: uv run python scripts/prepare_appimage.py data/build-appimage-tools
      - name: Package and checksum
        env:
          DOTNET_ROLL_FORWARD: Major
        run: uv run python scripts/package_release.py --platform '${{ matrix.platform }}' --arch '${{ matrix.arch }}'
      - name: Verify final AppImage
        if: runner.os == 'Linux'
        run: |
          for image in data/releases/*.AppImage; do
            uv run python scripts/verify_appimage.py "$image"
          done
      - name: Optional Windows portable ZIP
        if: runner.os == 'Windows' && (startsWith(github.ref, 'refs/tags/') || inputs.portable == true)
        run: uv run python scripts/package_release.py --platform windows --arch x64 --portable
      - name: Attest final release packages
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        id: attest
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: |
            data/releases/*.dmg
            data/releases/*.msi
            data/releases/*.AppImage
            data/releases/*-portable.zip
      - name: Attach verification bundles
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        env:
          ATTESTATION_BUNDLE: ${{ steps.attest.outputs.bundle-path }}
        run: uv run python scripts/attest_release.py data/releases --bundle "$ATTESTATION_BUNDLE"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: package-${{ matrix.platform }}-${{ matrix.arch }}
          path: data/releases/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 14

  publish-release:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          pattern: package-*
          path: release-assets
          merge-multiple: true
      - name: Verify checksums, upload packages and publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: uv run --frozen --extra desktop python scripts/create_draft_release.py release-assets --publish
