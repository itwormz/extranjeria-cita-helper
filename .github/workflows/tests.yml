name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Classify the complete change
        id: scope
        run: python3 scripts/ci_scope.py
      - name: Check documentation links and markup
        run: python3 scripts/check_docs.py
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: '3.13'
      - name: Install Linux GUI libraries
        if: steps.scope.outputs.docs_only != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libegl1 libxcb-cursor0 libxkbcommon-x11-0 libpulse0 libxcb-keysyms1 libxcb-icccm4
      - name: Install locked dependencies
        if: steps.scope.outputs.docs_only != 'true'
        run: uv sync --frozen --extra desktop --extra build
      - name: Check release metadata
        if: steps.scope.outputs.docs_only != 'true'
        run: uv run python scripts/preflight.py --metadata-only
      - name: Check prepared release PR
        if: github.event_name == 'pull_request' && steps.scope.outputs.docs_only != 'true'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          if ! git diff --quiet "$BASE_SHA" HEAD -- .github/release-version; then
            version=$(cat .github/release-version)
            [[ "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
            test "$version" = "$(uv run python -c 'from app.version import VERSION; print(VERSION)')"
          fi
      - name: Check source privacy
        if: steps.scope.outputs.docs_only != 'true'
        run: uv run python scripts/check_privacy.py --tree .
      - name: Check documentation-only source privacy
        if: steps.scope.outputs.docs_only == 'true'
        run: uv run --no-project --with PyYAML==6.0.3 python scripts/check_privacy.py --tree .
      - name: Run unit and offscreen UI tests
        if: steps.scope.outputs.docs_only != 'true'
        run: uv run pytest -v -s -o addopts= --tb=short -o faulthandler_timeout=120
