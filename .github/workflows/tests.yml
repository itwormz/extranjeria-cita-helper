name: Tests
on:
  push:
    branches: [santacita-beta, main]
  pull_request:
    branches: [santacita-beta, main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: santacita-tests-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  scope:
    uses: ./.github/workflows/scope.yml
    with:
      base: ${{ github.event.pull_request.base.sha || github.event.before }}
      head: ${{ github.event.pull_request.head.sha || github.sha }}
  tests:
    name: Tests
    needs: scope
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
      - name: Documentation and release tooling
        run: |
          node packaging/check-docs.mjs
          node --test packaging/tests/*.test.mjs
      - name: Install pinned Rust toolchain
        if: needs.scope.outputs.mode != 'docs'
        run: |
          toolchain=$(node -e "process.stdout.write(require('fs').readFileSync('rust-toolchain.toml','utf8').match(/^channel = \"([^\"]+)\"/m)[1])")
          rustup toolchain install "$toolchain" --profile minimal
      - name: Source metadata, Rust and frontend
        if: needs.scope.outputs.mode != 'docs'
        run: |
          node packaging/release.mjs metadata
          cargo test --workspace --locked --no-fail-fast
          node desktop-ui/scripts/prepare.mjs
          node --test desktop-ui/tests/*.test.mjs
