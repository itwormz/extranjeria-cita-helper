<path class="edge loop" d="M340 597H660V535H198V565" />
<path class="edge loop" d="M340 629H780V153H198V170" />
<rect x="55" y="90" width="285" height="50" rx="9" class="box" />
<text x="198" y="121" class="" text-anchor="middle">Inicio · seleccionar perfil</text>
<rect x="55" y="170" width="285" height="64" rx="9" class="box" />
<text x="198" y="196" class="" text-anchor="middle">Provincia → trámite → acceso</text>
<text x="198" y="219" class="small" text-anchor="middle">Según el perfil seleccionado</text>
<rect x="55" y="290" width="285" height="64" rx="9" class="box" />
<text x="198" y="316" class="" text-anchor="middle">Formulario del solicitante</text>
<text x="198" y="339" class="small" text-anchor="middle">Datos: introducir / copiar</text>
<rect x="55" y="425" width="285" height="64" rx="9" class="box" />
<text x="198" y="451" class="" text-anchor="middle">Menú de solicitud</text>
<text x="198" y="474" class="small" text-anchor="middle">Solicitar cita</text>
<rect x="55" y="565" width="285" height="64" rx="9" class="box" />
<text x="198" y="591" class="" text-anchor="middle">Resultado de búsqueda</text>
<text x="198" y="614" class="small" text-anchor="middle">Sin citas u oficinas disponibles</text>
<rect x="55" y="730" width="285" height="64" rx="9" class="box" />
<text x="198" y="756" class="" text-anchor="middle">Oficina → datos de contacto</text>
<text x="198" y="779" class="small" text-anchor="middle">1 oficina — auto · varias — manual</text>
<rect x="55" y="860" width="285" height="64" rx="9" class="box" style="fill:#132b21;stroke:#41845e" />
<text x="198" y="886" class="" text-anchor="middle">Cita → control manual</text>
<text x="198" y="909" class="small" text-anchor="middle">Fecha, hora, CAPTCHA, confirmación</text>
<text x="360" y="312" class="option" text-anchor="start">Sin citas · opción «Esperar»</text>
<text x="213" y="389" class="option" text-anchor="start">Sin aviso / opción «Rellenar y continuar»</text>
<text x="360" y="587" class="option" text-anchor="start">Sin citas · opción «Recargar resultado»</text>
<text x="360" y="143" class="option" text-anchor="start">Sin citas · opción «Mediante Salir» / botón Aceptar</text>
