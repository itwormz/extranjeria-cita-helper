<svg role="img" aria-labelledby="title desc" xmlns="http://www.w3.org/2000/svg" width="1000" height="1030" viewBox="0 0 1000 1030"><title id="title">Búsqueda habitual de citas</title><desc id="desc">Mientras aparece el mensaje de que no hay citas, se actualiza el formulario sin introducir datos. Cuando desaparece, se vuelve a empezar desde la identificación. Solo se solicita cita tras un recorrido completo sin ese mensaje.</desc><defs><marker id="normal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#6B6D78"/></marker><marker id="accent" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#9BA4FF"/></marker><marker id="green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#75D69A"/></marker></defs><rect width="1000" height="1030" fill="#1D1E22"/><text x="48" y="46" font-family="Arial, sans-serif" font-size="30" font-weight="600" fill="#E8E8E8" text-anchor="start">Cómo funciona la búsqueda de citas</text><text x="48" y="79" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#A5A6AE" text-anchor="start">Búsqueda habitual: comprobar la disponibilidad antes de enviar los datos</text><path d="M788 314V132H283V168" fill="none" stroke="#9BA4FF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#accent)"/><text x="526" y="117" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#9BA4FF" text-anchor="start">Desaparece el mensaje → volver al inicio</text><path d="M283 248V314" fill="none" stroke="#6B6D78" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#normal)"/><path d="M502 358H638" fill="none" stroke="#9BA4FF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#accent)"/><text x="570" y="342" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#9BA4FF" text-anchor="middle">Sí</text><path d="M938 367H966V474H788V424" fill="none" stroke="#9BA4FF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#accent)" stroke-dasharray="6 6"/><text x="787" y="501" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#9BA4FF" text-anchor="middle">El mensaje sigue visible</text><path d="M283 402V514" fill="none" stroke="#75D69A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#green)"/><text x="306" y="444" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#75D69A" text-anchor="start">Sin mensaje «No hay citas»</text><text x="306" y="471" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#75D69A" text-anchor="start">durante todo el recorrido</text><path d="M283 598V670" fill="none" stroke="#6B6D78" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#normal)"/><text x="306" y="641" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#A5A6AE" text-anchor="start">Hay oficinas</text><path d="M502 556H788V670" fill="none" stroke="#6B6D78" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#normal)"/><text x="638" y="543" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#A5A6AE" text-anchor="start">Respuesta «No hay citas»</text><path d="M283 756V820" fill="none" stroke="#6B6D78" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#normal)"/><rect x="64" y="168" width="438" height="80" rx="12" fill="#26272C" stroke="#454751" stroke-width="1.5"/><text x="86" y="203" font-family="Arial, sans-serif" font-size="22" font-weight="600" fill="#E8E8E8" text-anchor="start">Recorrido desde la identificación</text><text x="86" y="232" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#A5A6AE" text-anchor="start">Provincia → trámite → identificación</text><rect x="64" y="314" width="438" height="88" rx="12" fill="#26272C" stroke="#454751" stroke-width="1.5"/><text x="86" y="349" font-family="Arial, sans-serif" font-size="22" font-weight="600" fill="#E8E8E8" text-anchor="start">¿Aparece «No hay citas»?</text><text x="86" y="378" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#A5A6AE" text-anchor="start">En el formulario, antes de introducir datos</text><rect x="638" y="314" width="300" height="110" rx="12" fill="#2A2D40" stroke="#9BA4FF" stroke-width="1.5"/><text x="660" y="349" font-family="Arial, sans-serif" font-size="22" font-weight="600" fill="#E8E8E8" text-anchor="start">Actualizar el formulario</text><text x="660" y="378" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#A5A6AE" text-anchor="start">Esperar el intervalo indicado.</text><text x="660" y="404" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#A5A6AE" text-anchor="start">Sin introducir datos.</text><rect x="64" y="514" width="438" height="84" rx="12" fill="#26272C" stroke="#454751" stroke-width="1.5"/><text x="86" y="549" font-family="Arial, sans-serif" font-size="22" font-weight="600" fill="#E8E8E8" text-anchor="start">Introducir los datos</text><text x="86" y="578" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#A5A6AE" text-anchor="start">Pulsar Solicitar cita</text><rect x="64" y="670" width="438" height="86" rx="12" fill="#26272C" stroke="#454751" stroke-width="1.5"/><text x="86" y="705" font-family="Arial, sans-serif" font-size="22" font-weight="600" fill="#E8E8E8" text-anchor="start">Elegir oficina y datos de contacto</text><text x="86" y="734" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#A5A6AE" text-anchor="start">Una oficina: automática; varias: elegir a mano</text><rect x="638" y="670" width="300" height="110" rx="12" fill="#26272C" stroke="#454751" stroke-width="1.5"/><text x="660" y="705" font-family="Arial, sans-serif" font-size="22" font-weight="600" fill="#E8E8E8" text-anchor="start">Esperar y reintentar</text><text x="660" y="734" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#A5A6AE" text-anchor="start">Con cod. oper, usar las pausas</text><text x="660" y="760" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#A5A6AE" text-anchor="start">de los ajustes de protección.</text><path d="M938 725H984V132H788" fill="none" stroke="#6B6D78" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#normal)"/><rect x="64" y="820" width="438" height="100" rx="12" fill="#21362B" stroke="#75D69A" stroke-width="1.5"/><text x="86" y="855" font-family="Arial, sans-serif" font-size="22" font-weight="600" fill="#E8E8E8" text-anchor="start">Completar la reserva a mano</text><text x="86" y="884" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#A5A6AE" text-anchor="start">Fecha, hora, CAPTCHA</text><text x="86" y="910" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#A5A6AE" text-anchor="start">y confirmación final</text><path d="M48 959H952" stroke="#454751"/><text x="48" y="992" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#A5A6AE" text-anchor="start">Se mantienen las pausas de protección. Esquema del modo de búsqueda habitual.</text></svg>