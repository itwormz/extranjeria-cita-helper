<svg xmlns="http://www.w3.org/2000/svg" width="820" height="1010" viewBox="0 0 820 1010" role="img" aria-labelledby="title desc">
<title id="title">Funcionamiento de la aplicación</title><desc id="desc">Recorrido hasta la reserva manual. Dos opciones independientes: esperar o rellenar el formulario; Salir o recargar el resultado. Las flechas muestran los retornos.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10" fill="#a3acba" /></marker><style>text{font-family:Arial,sans-serif;fill:#e6edf3;font-size:17px}.small{font-size:14px;fill:#a3acba}.option{font-size:15px;fill:#7eb5e8}.edge{fill:none;stroke:#a3acba;stroke-width:1.7;marker-end:url(#arrow);stroke-linejoin:round}.loop{stroke:#7eb5e8}.box{fill:#161b22;stroke:#3d444d;stroke-width:1.4}</style></defs>
<rect width="820" height="1010" fill="#0d1117" />
<text x="45" y="35" class="" text-anchor="start">Cita Extranjeria Helper</text>
<text x="45" y="62" class="small" text-anchor="start">De arriba abajo. Las flechas indican las condiciones de retorno.</text>
<path class="edge" d="M198 140V170" />
<path class="edge" d="M198 234V290" />
