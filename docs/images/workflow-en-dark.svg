<svg xmlns="http://www.w3.org/2000/svg" width="820" height="1010" viewBox="0 0 820 1010" role="img" aria-labelledby="title desc">
<title id="title">Application workflow</title><desc id="desc">Straight path to manual booking. Two independent options: wait or fill on the applicant form; Salir or result reload. Arrows show returns.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10" fill="#a3acba" /></marker><style>text{font-family:Arial,sans-serif;fill:#e6edf3;font-size:17px}.small{font-size:14px;fill:#a3acba}.option{font-size:15px;fill:#7eb5e8}.edge{fill:none;stroke:#a3acba;stroke-width:1.7;marker-end:url(#arrow);stroke-linejoin:round}.loop{stroke:#7eb5e8}.box{fill:#161b22;stroke:#3d444d;stroke-width:1.4}</style></defs>
<rect width="820" height="1010" fill="#0d1117" />
<text x="45" y="35" class="" text-anchor="start">Cita Extranjeria Helper</text>
<text x="45" y="62" class="small" text-anchor="start">Read top to bottom. Return conditions are shown on the arrows.</text>
