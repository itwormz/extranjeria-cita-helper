<svg role="img" aria-labelledby="title desc" xmlns="http://www.w3.org/2000/svg" width="1000" height="1030" viewBox="0 0 1000 1030"><title id="title">Обычный поиск ситы</title><desc id="desc">Пока сообщение Сит нет видно, бот обновляет форму без ввода данных. Когда сообщение исчезает, начинает полный проход с авторизации. Запрос записи возможен после прохода без сообщения Сит нет.</desc><defs><marker id="normal" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#6B6D78"/></marker><marker id="accent" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#9BA4FF"/></marker><marker id="green" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#75D69A"/></marker></defs><rect width="1000" height="1030" fill="#1D1E22"/><text x="48" y="46" font-family="Arial, sans-serif" font-size="30" font-weight="600" fill="#E8E8E8" text-anchor="start">Как бот ищет ситу</text><text x="48" y="79" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#A5A6AE" text-anchor="start">Обычный поиск: проверяем наличие сит до отправки данных</text><path d="M788 314V132H283V168" fill="none" stroke="#9BA4FF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#accent)"/><text x="526" y="117" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#9BA4FF" text-anchor="start">Сообщение исчезло → новый проход</text><path d="M283 248V314" fill="none" stroke="#6B6D78" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#normal)"/><path d="M502 358H638" fill="none" stroke="#9BA4FF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#accent)"/><text x="570" y="342" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#9BA4FF" text-anchor="middle">Есть</text><path d="M938 367H966V474H788V424" fill="none" stroke="#9BA4FF" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#accent)" stroke-dasharray="6 6"/><text x="787" y="501" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#9BA4FF" text-anchor="middle">Сообщение остаётся</text><path d="M283 402V514" fill="none" stroke="#75D69A" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#green)"/><text x="306" y="444" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#75D69A" text-anchor="start">Сообщения «Сит нет»</text><text x="306" y="471" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#75D69A" text-anchor="start">не было за весь проход</text><path d="M283 598V670" fill="none" stroke="#6B6D78" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#normal)"/><text x="306" y="641" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#A5A6AE" text-anchor="start">Есть офисы</text><path d="M502 556H788V670" fill="none" stroke="#6B6D78" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#normal)"/><text x="638" y="543" font-family="Arial, sans-serif" font-size="19" font-weight="400" fill="#A5A6AE" text-anchor="start">Ответ «Сит нет»</text><path d="M283 756V820" fill="none" stroke="#6B6D78" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#normal)"/><rect x="64" y="168" width="438" height="80" rx="12" fill="#26272C" stroke="#454751" stroke-width="1.5"/><text x="86" y="203" font-family="Arial, sans-serif" font-size="22" font-weight="600" fill="#E8E8E8" text-anchor="start">Полный проход с авторизации</text><text x="86" y="232" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#A5A6AE" text-anchor="start">Провинция → услуга → вход</text><rect x="64" y="314" width="438" height="88" rx="12" fill="#26272C" stroke="#454751" stroke-width="1.5"/><text x="86" y="349" font-family="Arial, sans-serif" font-size="22" font-weight="600" fill="#E8E8E8" text-anchor="start">Есть сообщение «Сит нет»?</text><text x="86" y="378" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#A5A6AE" text-anchor="start">На форме заявителя, до ввода данных</text><rect x="638" y="314" width="300" height="110" rx="12" fill="#2A2D40" stroke="#9BA4FF" stroke-width="1.5"/><text x="660" y="349" font-family="Arial, sans-serif" font-size="22" font-weight="600" fill="#E8E8E8" text-anchor="start">Обновляем форму</text><text x="660" y="378" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#A5A6AE" text-anchor="start">Ждём заданный интервал.</text><text x="660" y="404" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#A5A6AE" text-anchor="start">Данные не вводим.</text><rect x="64" y="514" width="438" height="84" rx="12" fill="#26272C" stroke="#454751" stroke-width="1.5"/><text x="86" y="549" font-family="Arial, sans-serif" font-size="22" font-weight="600" fill="#E8E8E8" text-anchor="start">Заполняем данные</text><text x="86" y="578" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#A5A6AE" text-anchor="start">Нажимаем Solicitar cita</text><rect x="64" y="670" width="438" height="86" rx="12" fill="#26272C" stroke="#454751" stroke-width="1.5"/><text x="86" y="705" font-family="Arial, sans-serif" font-size="22" font-weight="600" fill="#E8E8E8" text-anchor="start">Выбор офиса и контакты</text><text x="86" y="734" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#A5A6AE" text-anchor="start">Один офис — автоматически, иначе вручную</text><rect x="638" y="670" width="300" height="110" rx="12" fill="#26272C" stroke="#454751" stroke-width="1.5"/><text x="660" y="705" font-family="Arial, sans-serif" font-size="22" font-weight="600" fill="#E8E8E8" text-anchor="start">Выдерживаем паузу</text><text x="660" y="734" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#A5A6AE" text-anchor="start">При cod. oper — пауза</text><text x="660" y="760" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#A5A6AE" text-anchor="start">из настроек защиты.</text><path d="M938 725H984V132H788" fill="none" stroke="#6B6D78" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#normal)"/><rect x="64" y="820" width="438" height="100" rx="12" fill="#21362B" stroke="#75D69A" stroke-width="1.5"/><text x="86" y="855" font-family="Arial, sans-serif" font-size="22" font-weight="600" fill="#E8E8E8" text-anchor="start">Завершаем запись вручную</text><text x="86" y="884" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#A5A6AE" text-anchor="start">Дата, время, CAPTCHA</text><text x="86" y="910" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#A5A6AE" text-anchor="start">и окончательное подтверждение</text><path d="M48 959H952" stroke="#454751"/><text x="48" y="992" font-family="Arial, sans-serif" font-size="18" font-weight="400" fill="#A5A6AE" text-anchor="start">Защитные паузы сохраняются. Схема показывает основной режим поиска.</text></svg>